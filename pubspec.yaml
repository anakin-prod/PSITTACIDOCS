name: psittacidocs
description: "Psittacidocs — gestion d'élevage de psittacidés"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  path_provider: ^2.1.3
  intl: ^0.19.0
  url_launcher: ^6.2.6
  image_picker: ^1.1.2
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/species.json
    - assets/images/icon.png
    - assets/images/logo_horizontal.png
    - assets/images/logo_vertical.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/play_store_icon_512.png"
  adaptive_icon_background: "assets/images/adaptive_icon_background.png"
  adaptive_icon_foreground: "assets/images/adaptive_icon_foreground.png"
  min_sdk_android: 21
