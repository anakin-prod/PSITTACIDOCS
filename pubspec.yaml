name: psittacidocs
description: "Psittacidocs — gestion d'élevage de psittacidés"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  path_provider: ^2.1.3
  intl: ^0.19.0
  url_launcher: ^6.2.6
  image_picker: ^1.1.2
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/data/species.json
    - assets/data/parrot_facts.json
    - assets/images/icon.png
    - assets/images/splash_parrot.png
    - assets/images/logo_horizontal.png
    - assets/images/logo_vertical.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/play_store_icon_512.png"
  # Icône adaptative Android : fond bleu nuit uni + perroquet centré sur fond
  # transparent. Avec une marge de 16 %, l'image du premier plan correspond à
  # la zone visible de l'icône : même composition que l'icône de l'en-tête.
  adaptive_icon_background: "#0E2254"
  adaptive_icon_foreground: "assets/images/adaptive_icon_foreground.png"
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21

# Écran natif affiché pendant le démarrage de l'appli : fond bleu nuit et
# perroquet centré. Le même perroquet, à la même taille, est repris ensuite par
# l'écran animé (lib/screens/splash_view.dart), sans saute visible.
flutter_native_splash:
  color: "#0E2254"
  image: assets/images/splash_parrot.png
  android_12:
    color: "#0E2254"
    image: assets/images/splash_parrot_android12.png
  web: false
