# Deux workflows, à lancer à la main depuis Codemagic (bouton « Start new build »).
#
#   1 · Build de test       → un .apk à installer directement sur un téléphone.
#   2 · Build Google Play    → un .aab signé avec ta clé, à envoyer sur Google Play.
#   3 · Build iPhone         → un .ipa signé, envoyé automatiquement sur TestFlight.

#
# La clé de signature a été générée une fois pour toutes (script conservé dans
# scripts/generate_keystore.sh) et enregistrée dans Codemagic sous le nom
# « psittacidocs_upload ».
#
# Tous utilisent mac_mini_m2 : c'est la seule machine du compte gratuit
# (500 min/mois), et elle compile Android comme iPhone.

workflows:
  test-build:
    name: 1 · Build de test (APK à installer)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - psittacidocs_upload
    scripts:
      - name: Préparer le projet
        script: bash scripts/prepare_android.sh
      - name: Compiler l'APK de test
        script: |
          # Signé avec la clé de l'appli, dont l'empreinte est déclarée dans
          # Firebase : c'est ce qui permet la connexion Google. S'installe
          # directement sur un téléphone Android ; Google Play n'accepte que le
          # .aab du workflow 2. Si une version signée autrement est déjà
          # installée (ancien test ou Google Play), la désinstaller d'abord.
          flutter build apk --release --build-number=$BUILD_NUMBER
          mkdir -p livrable
          cp build/app/outputs/flutter-apk/app-release.apk "livrable/psittacidocs-test-$BUILD_NUMBER.apk"
    artifacts:
      - livrable/*.apk

  play-release:
    name: 2 · Build Google Play (AAB signé)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        # Nom de référence à donner à la clé lors de son envoi dans Codemagic
        # (Team settings → codemagic.yaml settings → Code signing identities
        # → Android keystores → Reference name).
        - psittacidocs_upload
    scripts:
      - name: Vérifier la clé de signature
        script: |
          if [ -z "${CM_KEYSTORE_PATH:-}" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "Aucune clé de signature reçue. Envoie d'abord la clé dans Codemagic"
            echo "avec le nom de référence « psittacidocs_upload » (voir README.md)."
            exit 1
          fi
          echo "Clé de signature reçue (alias : $CM_KEY_ALIAS)."
      - name: Préparer le projet
        script: bash scripts/prepare_android.sh
      - name: Compiler l'App Bundle signé
        script: |
          # Le numéro de build (versionCode) augmente à chaque build : Google Play
          # refuse deux envois avec le même numéro.
          flutter build appbundle --release --build-number=$BUILD_NUMBER
      - name: Contrôler la signature
        script: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          CERT=$(keytool -printcert -jarfile "$AAB" 2>&1 || true)
          if echo "$CERT" | grep -q "Android Debug"; then
            echo "Le fichier est signé avec la clé de débogage : Google Play le refuserait."
            exit 1
          fi
          if ! echo "$CERT" | grep -q "Owner:"; then
            echo "Le fichier n'est pas signé."
            exit 1
          fi
          echo "Signature correcte :"
          echo "$CERT" | grep -m1 "Owner:"
          mkdir -p livrable
          cp "$AAB" "livrable/psittacidocs-play-$BUILD_NUMBER.aab"
    artifacts:
      - livrable/*.aab
    # Publication automatique sur Google Play (facultatif, plus tard) : le tout
    # premier .aab doit de toute façon être envoyé à la main dans la Play Console.
    # Ensuite, crée un groupe de variables « google_play » contenant
    # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, ajoute « groups: [google_play] » dans
    # environment, et décommente ce bloc :
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal

  ios-release:
    name: 3 · Build iPhone (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    # Clé d'API App Store Connect (commune à toutes les applis du compte Apple)
    # enregistrée dans Codemagic sous ce nom
    # (Integrations → Developer Portal → Manage keys). Elle sert à signer l'appli
    # et à l'envoyer sur TestFlight.
    integrations:
      app_store_connect: tyto_apple
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Codemagic choisit tout seul le certificat « Apple Distribution » et le
      # profil App Store de app.psittacidocs enregistrés dans Code signing
      # identities (voir README.md, partie iPhone).
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.psittacidocs
    scripts:
      - name: Préparer le projet
        script: bash scripts/prepare_ios.sh
      - name: Appliquer la signature au projet Xcode
        script: xcode-project use-profiles
      - name: Compiler l'IPA signée
        script: |
          # Le numéro de build augmente à chaque build : App Store Connect
          # refuse deux envois avec le même numéro pour une même version.
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # L'appli arrive dans TestFlight (onglet TestFlight d'App Store Connect)
        # après le traitement d'Apple, en général 10 à 30 minutes, et devient
        # installable par le groupe de test interne. Passer à true seulement
        # pour l'envoyer aussi aux testeurs externes (vérification bêta d'Apple,
        # qui demande les informations de test remplies dans TestFlight).
        submit_to_testflight: false
