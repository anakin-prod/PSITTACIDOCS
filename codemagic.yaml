workflows:
  android-release:
    name: Psittacidocs — Android
    max_build_duration: 60
    # mac_mini_m2 est la seule machine disponible sur un compte Codemagic
    # personnel gratuit (500 min/mois). Elle compile aussi très bien Android.
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      # Pour publier automatiquement sur Google Play plus tard : créez un groupe
      # de variables "google_play" dans Codemagic, puis décommentez ces lignes.
      # groups:
      #   - google_play
    scripts:
      - name: Générer les dossiers de plateforme (Android/iOS)
        script: |
          # Ce projet ne contient volontairement pas les dossiers android/ et ios/,
          # car leur contenu (Gradle, Xcode) est très sensible à la version de
          # Flutter utilisée pour les générer. `flutter create .` les régénère
          # ici avec la version exacte de Flutter de cette machine de build, sans
          # toucher au code Dart existant (lib/, pubspec.yaml, assets/).
          flutter create . --platforms=android,ios --org com.psittacidocs --project-name psittacidocs
      - name: Installer les dépendances
        script: flutter pub get
      - name: Générer les icônes d'appli
        script: dart run flutter_launcher_icons
      - name: Compiler l'App Bundle Android
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
    # Pour recevoir un e-mail à chaque build, décommentez et mettez votre adresse.
    # publishing:
    #   email:
    #     recipients:
    #       - votre-email@exemple.com
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
